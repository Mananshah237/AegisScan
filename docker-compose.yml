services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=autoappsec
    # Internal-only (no host port) so multiple project stacks can run side by side.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # Internal-only (no host port) so multiple project stacks can run side by side.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/autoappsec
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=changethisdevsecret
      - BACKEND_CORS_ORIGINS=["http://localhost:3001"]
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock # Allow sibling container access for ZAP
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/autoappsec
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=changethisdevsecret
      # Real host path to ./backend/artifacts. The worker spawns ZAP as a SIBLING
      # container via the Docker socket, so this must be the host path (not a path
      # inside the worker) for the bind mount of ZAP's /zap/wrk to line up with
      # the directory the worker reads reports back from.
      - HOST_ARTIFACTS_PATH=C:/Users/mgroc/Downloads/projects/AegisScan/backend/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this at build time; points the SPA at the backend's host port.
        VITE_API_URL: http://localhost:8001
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
